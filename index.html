  {"title":"【初心者必見】珈琲専門店がオススメする初めてのコーヒーの選び方","href":"https://www.rakuten.co.jp/sawaicoffee-tea/contents/hajimetecoffee/","img":"https://tshop.r10s.jp/sawaicoffee-tea/cabinet/contents/ct_hajimetecoffee_00.jpg","date":"2024-09-19","cat":"beans"},

  {"title":"【コーヒーの保存方法】珈琲屋さんがオススメするコーヒー豆の保存方法","href":"https://www.rakuten.co.jp/sawaicoffee-tea/contents/hozon/","img":"https://tshop.r10s.jp/sawaicoffee-tea/cabinet/contents/ct_hozon_00.jpg","date":"2024-09-02","cat":"brew"}
];

const SYN_GROUPS = [
  ['アイス','冷たい','急冷','氷','ロック'],
  ['ホット','温か','あたたか'],
  ['ギフト','贈り物','プレゼント','贈る'],
  ['淹れ方','入れ方','淹れる','抽出'],
  ['豆','銘柄','ブレンド','産地','品種'],
  ['レシピ','作り方','アレンジ'],
  ['器具','ドリッパー','フィルター'],
];

const BATCH = 6;

function fmtDate(d){ return d.replace(/-/g,'.'); }
function catOf(key){ return CATS.find(c=>c.key===key); }

function renderTray(){
  const tray = document.getElementById('cuppingTray');
  tray.innerHTML = CATS.map(c=>{
    const count = ITEMS.filter(i=>i.cat===c.key).length;
    return `<button class="cup" data-cat="${c.key}" style="--cup-color:${c.color}">
      <span class="cup-count jost">${count}</span>
      <span class="cup-label">${c.ja}</span>
    </button>`;
  }).join('');
  tray.querySelectorAll('.cup').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('cat-'+btn.dataset.cat).scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderNav(){
  const nav = document.getElementById('shelfIndex');
  nav.innerHTML = CATS.map(c=>{
    const count = ITEMS.filter(i=>i.cat===c.key).length;
    return `<a href="#cat-${c.key}" class="nav-pill" data-cat="${c.key}" style="--dot:${c.color}">
      <span class="dot"></span>${c.ja}<span class="n jost">${count}</span>
    </a>`;
  }).join('');
}

function noteRow(it, opts){
  opts = opts || {};
  const dot = opts.showDot ? `<span class="cat-dot" style="background:${catOf(it.cat).color}"></span>` : '';
  return `<a class="note-row" href="${it.href}" target="_blank" rel="noopener">
    <div class="note-thumb"><img src="${it.img}" alt="" loading="lazy"></div>
    <div class="note-body">
      <p class="note-title">${it.title}</p>
      <div class="note-meta">${dot}<time class="note-date jost">${fmtDate(it.date)}</time></div>
    </div>
  </a>`;
}

function renderShelves(){
  const main = document.getElementById('shelves');
  main.innerHTML = CATS.map(c=>{
    const catItems = ITEMS.filter(i=>i.cat===c.key).sort((a,b)=> b.date.localeCompare(a.date));
    const featured = catItems[0];
    const rest = catItems.slice(1);
    const rowsHtml = rest.map((it,i)=>{
      const hiddenAttr = i >= BATCH ? ' hidden' : '';
      return `<div class="note-row-wrap" data-idx="${i}"${hiddenAttr}>${noteRow(it)}</div>`;
    }).join('');
    const moreCount = Math.max(0, rest.length - BATCH);
    const loadMoreBtn = moreCount > 0
      ? `<button class="load-more" data-cat="${c.key}" data-shown="${BATCH}">もっと見る<span class="jost"> (+${Math.min(BATCH, moreCount)})</span></button>`
      : '';
    return `
    <section id="cat-${c.key}" class="shelf" style="--accent:${c.color}">
      <div class="shelf-inner">
        <div class="shelf-head">
          <span class="shelf-num jost">${c.num}</span>
          <div class="shelf-heading">
            <p class="shelf-en">${c.en}</p>
            <h2>${c.ja}</h2>
            <p class="shelf-desc">${c.desc}</p>
          </div>
          <span class="shelf-count jost">${catItems.length}<small>本</small></span>
        </div>
        <a class="featured" href="${featured.href}" target="_blank" rel="noopener">
          <div class="featured-media"><img src="${featured.img}" alt="" loading="lazy"></div>
          <div class="featured-body">
            <span class="featured-tag">最新の一本</span>
            <h3>${featured.title}</h3>
            <time class="jost">${fmtDate(featured.date)}</time>
          </div>
        </a>
        <div class="note-list" data-cat="${c.key}">${rowsHtml}</div>
        ${loadMoreBtn}
      </div>
    </section>`;
  }).join('');

  main.querySelectorAll('.load-more').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const list = main.querySelector(`.note-list[data-cat="${btn.dataset.cat}"]`);
      const rows = Array.from(list.querySelectorAll('.note-row-wrap'));
      const shown = parseInt(btn.dataset.shown, 10);
      const next = shown + BATCH;
      rows.forEach(r=>{ if(parseInt(r.dataset.idx, 10) < next) r.hidden = false; });
      const remaining = rows.length - next;
      if(remaining <= 0){
        btn.remove();
      } else {
        btn.dataset.shown = next;
        btn.querySelector('span').textContent = ` (+${Math.min(BATCH, remaining)})`;
      }
    });
  });
}

function matches(item, q){
  if(!q) return true;
  if(item.title.includes(q)) return true;
  for(const group of SYN_GROUPS){
    if(group.some(w=>w.includes(q)||q.includes(w))){
      if(group.some(w=>item.title.includes(w))) return true;
    }
  }
  return false;
}

function runSearch(q){
  const shelvesEl = document.getElementById('shelves');
  const trayEl = document.querySelector('.cupping-tray');
  const resultsEl = document.getElementById('searchResults');
  q = q.trim();
  if(!q){
    shelvesEl.hidden = false;
    resultsEl.hidden = true;
    return;
  }
  shelvesEl.hidden = true;
  resultsEl.hidden = false;
  const found = ITEMS.filter(it=>matches(it,q)).sort((a,b)=> b.date.localeCompare(a.date));
  document.getElementById('searchCount').textContent = found.length + ' 件';
  const grid = document.getElementById('searchGrid');
  if(found.length === 0){
    grid.innerHTML = `<p class="search-empty">該当する読みものが見つかりませんでした。別のキーワードでお試しください。</p>`;
  } else {
    grid.innerHTML = found.map(it=>noteRow(it, {showDot:true})).join('');
  }
}

function initNavHighlight(){
  const links = document.querySelectorAll('.nav-pill');
  const sections = CATS.map(c=>document.getElementById('cat-'+c.key));
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const key = entry.target.id.replace('cat-','');
        links.forEach(l=>l.classList.toggle('active', l.dataset.cat===key));
      }
    });
  }, {rootMargin:'-40% 0px -50% 0px'});
  sections.forEach(s=>s && obs.observe(s));
}

renderTray();
renderNav();
renderShelves();
initNavHighlight();
document.getElementById('searchInput').addEventListener('input', (e)=>runSearch(e.target.value));
</script>
</body>
</html>
